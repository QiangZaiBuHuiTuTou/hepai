<style>
@charset "UTF-8";
:root{--paper:#f5f1e8;--card:#fffdf8;--ink:#343b2e;--muted:#858575;--line:#deded0;--green:#dde7c0;--green-dark:#637b42;--purple:#e8e0f0;--purple-dark:#817096;--yellow:#f0e4b9;--peach:#f0dacc;--shadow:0 16px 45px #41412a08;--radius:28px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:100px}
body{margin:0;color:var(--ink);background:var(--paper);font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",Arial,sans-serif;font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button,a{-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.42}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #8da46b;outline-offset:4px}
a{color:inherit;text-decoration:none}
button{border:0;background:none}
svg{display:block;max-width:100%}
h1,h2,h3,p{margin:0}
h1,h2,h3{line-height:1.35}
::selection{background:#dce7bb}
.skip-link{position:fixed;z-index:300;top:8px;left:12px;background:var(--ink);color:white;padding:10px 16px;transform:translateY(-160%)}
.skip-link:focus{transform:translateY(0)}
.initial-loading{padding:100px;text-align:center}
.shell{max-width:1200px;margin:0 auto;padding:0 38px}
.site-header{height:92px;display:flex;align-items:center;justify-content:space-between;gap:30px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;padding:0;white-space:nowrap}
.brand-mark{height:39px;width:39px;background:var(--green);border-radius:13px;display:grid;place-items:center;transform:rotate(-5deg)}
.brand-title{font-size:20px;font-weight:800;letter-spacing:1px}
.brand-note{display:block;font-size:10px;color:var(--muted);letter-spacing:1.8px;margin-top:-2px;text-align:left}
.nav{display:flex;gap:28px;align-items:center;font-size:13px}
.nav button{padding:8px 0;position:relative}
.nav button:hover{color:var(--green-dark)}
.nav .nav-outline{border:1px solid #bdc6a4;border-radius:100px;padding:10px 18px;display:flex;gap:8px;align-items:center}
.flow-header .nav{gap:14px}
.saved-label{color:var(--muted);font-size:12px;display:flex;gap:7px;align-items:center}
.small-icon{display:inline-flex;align-items:center;justify-content:center}
.hero{display:grid;grid-template-columns:1.06fr 1fr;gap:26px;align-items:center;padding:70px 0 42px;min-height:610px}
.eyebrow{display:flex;gap:9px;align-items:center;font-size:12px;font-weight:600;letter-spacing:1px;color:#77815f;margin-bottom:22px}
.eyebrow-dot{width:7px;height:7px;border-radius:50%;background:#839665}
.hero h1{font-size:clamp(42px,5.1vw,66px);font-weight:900;letter-spacing:-2px;line-height:1.28}
.hero h1 .emphasis{position:relative;display:inline-block;z-index:0}
.hero h1 .emphasis:after{content:"";position:absolute;bottom:2px;left:-3px;right:-8px;height:17px;background:var(--green);border-radius:35%;z-index:-1;transform:rotate(-1.2deg)}
.hero-copy{margin:25px 0 29px;max-width:435px;font-size:15px;line-height:1.95;color:#767a69}
.hero-copy strong{font-weight:500;color:var(--ink)}
.button-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid transparent;min-height:49px;padding:12px 22px;border-radius:14px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:12px;transition:background .18s,transform .18s}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn-primary{background:var(--ink);color:#fbfcf3}
.btn-primary:hover:not(:disabled){background:#4b5740}
.btn-secondary{background:#fffdf759;border-color:#cdd1bb}
.btn-green{background:var(--green);color:#445532}
.btn-green:hover:not(:disabled){background:#d0ddac}
.btn-quiet{padding:9px 12px;min-height:40px;color:var(--muted);font-weight:400}
.hero-fine{font-size:11px;color:#939483;margin-top:16px}
.hero-art{position:relative;background:#eceedd;border-radius:44% 47% 43% 49%;min-height:422px;display:flex;align-items:center;justify-content:center;transform:rotate(1deg)}
.hero-art>svg{width:112%;max-width:112%;position:relative;z-index:1;transform:rotate(-1deg)}
.art-badge{position:absolute;z-index:2;background:var(--card);border:1px solid #d0d7bf;padding:9px 16px;border-radius:13px;box-shadow:var(--shadow);font-size:12px;display:flex;gap:9px;align-items:center}
.art-badge.top{top:5px;left:28px;transform:rotate(-6deg)}
.art-badge.bottom{right:6px;bottom:28px;transform:rotate(5deg)}
.art-spark{position:absolute;right:0;top:35px;width:28px;color:#a6b97a;transform:rotate(12deg)}
.hero-caption{position:absolute;bottom:-20px;font-size:11px;color:#8e927f;letter-spacing:1px}
.intro-strip{display:grid;grid-template-columns:1.65fr repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:25px 0;gap:22px}
.intro-strip .strip-intro{font-size:14px;line-height:1.7;max-width:225px;color:#777d68;align-self:center}
.strip-stat{padding-left:27px;border-left:1px solid var(--line);display:flex;gap:12px;align-items:center}
.strip-stat strong{font-size:35px;line-height:1.2;font-family:Georgia,"Times New Roman",serif;font-weight:400;color:#586549}
.strip-stat span{font-size:12px;color:#858a76;line-height:1.7}
.home-section{padding:69px 0 10px;scroll-margin-top:20px}
.section-top{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:27px}
.section-kicker{font-size:11px;letter-spacing:2px;color:#9a9b89;margin-bottom:10px}
.section-top h2{font-size:28px;font-weight:800}
.section-top p{color:var(--muted);font-size:13px;margin-top:9px}
.text-link{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:#778558;padding:8px 0;white-space:nowrap}
.portrait-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.mini-portrait{padding:21px 24px 23px;border-radius:23px;border:1px solid #dbdfce;background:#e9ecdb;position:relative;overflow:hidden;text-align:left}
.mini-portrait:nth-child(2){background:#ece4ed;border-color:#e0d9e1}
.mini-portrait:nth-child(3){background:#f2e8cd;border-color:#e4dcc5}
.mini-code{font-size:10px;letter-spacing:1.2px;color:#8a9178}
.mini-portrait svg{width:100%;height:160px;margin:5px 0 8px}
.mini-portrait h3{font-size:22px;margin-bottom:7px;letter-spacing:.3px}
.mini-portrait p{font-size:12px;line-height:1.8;color:#7f8273;min-height:42px}
.mini-portrait:hover{box-shadow:var(--shadow)}
.dimensions-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0 25px}
.dimension-teaser{border-top:1px solid var(--line);padding:20px 0}
.dimension-number{font-size:11px;color:#9b9e8d;letter-spacing:1px;margin-bottom:8px}
.dimension-teaser h3{font-size:16px;margin-bottom:8px}
.dimension-teaser p{font-size:12px;color:#909382;line-height:1.8;max-width:220px}
.method-note{margin:34px 0 30px;padding:24px 27px;border:1px solid var(--line);background:#faf8f1;border-radius:20px;display:flex;gap:24px;align-items:center}
.method-note .note-symbol{font-size:25px;font-family:Georgia,serif;color:#98a479}
.method-note h3{font-size:15px;margin-bottom:6px}
.method-note p{font-size:12px;color:var(--muted)}
.method-note .text-link{margin-left:auto}
.site-footer{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:30px 0;border-top:1px solid var(--line);font-size:11px;color:#919582;margin-top:50px}
.site-footer button{font-size:11px;color:#7c8961;text-decoration:underline;text-underline-offset:4px}
.resume-notice{display:flex;align-items:center;justify-content:space-between;gap:15px;background:#edf0dd;border:1px solid #dbe1c6;border-radius:16px;padding:14px 19px;margin-top:20px}
.resume-notice p{font-size:13px}
.resume-notice small{display:block;font-size:11px;color:#949c80}
.resume-notice .btn{min-height:39px;padding:8px 16px;font-size:12px}
.flow-shell{max-width:1030px;margin:0 auto;padding:0 32px}
.flow-steps{display:flex;justify-content:center;gap:24px;font-size:12px;color:#aaa997;margin:31px 0 33px}
.flow-step{display:flex;gap:9px;align-items:center}
.flow-step span{width:22px;height:22px;display:grid;place-items:center;border:1px solid #d2d4c3;border-radius:50%;font-size:10px}
.flow-step.active{color:var(--ink);font-weight:600}
.flow-step.active span{background:var(--green);border-color:#c5d2a6}
.step-line{width:45px;height:1px;background:var(--line);align-self:center}
.setup-heading{text-align:center;margin-bottom:28px}
.setup-heading h1{font-size:32px;letter-spacing:-.7px}
.setup-heading p{font-size:13px;color:var(--muted);margin-top:10px}
.setup-card{max-width:740px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:32px 37px;box-shadow:var(--shadow)}
.people-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.person-card{background:#f4eff7;border:1px solid #e4ddea;border-radius:20px;padding:22px}
.person-card.person-a{background:#f0f3e4;border-color:#dfe6ce}
.person-label{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:#8f7b9c}
.person-a .person-label{color:#7a895d}
.person-label>span{width:23px;height:23px;background:#e8deef;border-radius:50%;display:grid;place-items:center;font-size:11px}
.person-a .person-label>span{background:#e1eacb}
.person-role{font-size:17px;font-weight:700;margin:10px 0 14px}
.type-button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:6px;border:1px solid #d8cedf;background:#fffdf9c9;border-radius:12px;padding:13px 14px}
.person-a .type-button{border-color:#d5dfc3}
.type-value{font-family:Georgia,serif;font-size:23px;font-weight:600;letter-spacing:1px}
.type-empty{font-size:13px;color:#a6a08f}
.person-animal{font-size:11px;color:#989184;margin-top:8px;min-height:18px}
.field-label{display:block;font-size:12px;color:#7c8170;margin:20px 0 7px}
.select-field{width:100%;background:#fffdf9;border:1px solid #dce0d0;border-radius:11px;min-height:43px;padding:9px 11px;font-size:12px;appearance:auto}
.setup-card .form-rule{border:0;border-top:1px dashed var(--line);margin:28px 0 23px}
.setup-fields{display:grid;grid-template-columns:1fr 1fr;gap:4px 20px}
.setup-fields .field-label{margin-top:10px}
.segmented{display:flex;padding:4px;background:#f0f0e7;border-radius:12px;gap:4px;margin-top:8px}
.segmented button{flex:1;padding:8px 10px;border-radius:9px;font-size:12px;color:#979981}
.segmented button.active{background:white;box-shadow:0 2px 7px #525a3510;color:#52603d}
.setup-foot{margin-top:24px;padding-top:20px;border-top:1px solid #ececde}
.setup-foot p{font-size:11px;line-height:1.9;color:#989987;margin-bottom:16px}
.setup-foot .btn{width:100%}
.setup-back{display:block;margin:20px auto;font-size:12px;color:#939982}
.quiz-layout{display:grid;grid-template-columns:minmax(0,660px) 255px;gap:25px;align-items:start;margin:25px 0 45px}
.quiz-card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:29px 35px 25px;box-shadow:var(--shadow);min-height:575px}
.quiz-topline{display:flex;justify-content:space-between;gap:20px;align-items:center;font-size:11px;color:#939883;letter-spacing:.3px}
.quiz-group{padding:5px 11px;border-radius:100px;background:#eef1df;color:#778358;display:flex;gap:6px;align-items:center}
.progress-track{height:4px;background:#eeeee2;border-radius:10px;margin:18px 0 24px;overflow:hidden}
.progress-fill{background:#adb985;height:100%;border-radius:10px;transition:width .25s}
.question-title{font-size:23px;line-height:1.75;font-weight:700;letter-spacing:-.3px;min-height:78px}
.question-help{font-size:11px;line-height:1.8;color:#9a9d89;margin:8px 0 22px}
.answer-list{display:grid;gap:9px}
.answer-option{display:flex;gap:14px;align-items:center;min-height:48px;border:1px solid #e4e5d7;padding:10px 15px;border-radius:12px;text-align:left;font-size:13px;background:#fdfcf7;transition:background .15s,border-color .15s}
.answer-option:hover{background:#f1f4e7;border-color:#cbd6b4}
.answer-option .answer-key{width:23px;height:23px;border:1px solid #e0e1d3;border-radius:7px;font-size:11px;display:grid;place-items:center;color:#a0a28e;flex-shrink:0}
.answer-option.selected{background:#e9efd8;border-color:#acbf87;color:#3f5530;font-weight:600}
.answer-option.selected .answer-key{background:#748b54;color:#fff;border-color:#748b54}
.answer-option .answer-check{margin-left:auto;width:19px;color:#718548;opacity:0}
.answer-option.selected .answer-check{opacity:1}
.answer-option.unknown{margin-top:3px;background:#f5f2ed;border-style:dashed;color:#8b8a7d}
.answer-option.unknown.selected{background:#ebe9e0;border-style:solid;border-color:#bcbcaf;color:#65685a}
.answer-option.unknown.selected .answer-key{background:#8e9580;border-color:#8e9580}
.answer-description{display:block;font-size:11px;color:#8d9780;font-weight:400;margin-top:2px}
.quiz-navigation{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:25px}
.quiz-navigation .btn{min-width:145px}
.previous{display:flex;align-items:center;gap:8px;color:#969c88;font-size:12px;padding:8px 0}
.quiz-clarifier{margin-top:18px;border-top:1px dashed #e3e6d5;padding-top:14px;font-size:10px;color:#aaa98e;line-height:1.8}
.quiz-aside{border:1px solid #dfe2ce;background:#eceedf;border-radius:23px;padding:21px 22px;position:sticky;top:25px}
.quiz-aside .aside-kicker{font-size:10px;letter-spacing:1px;color:#969f82}
.quiz-aside h2{font-size:18px;line-height:1.6;margin:11px 0 10px}
.quiz-aside p{font-size:12px;color:#8c947b;line-height:1.9}
.quiz-aside svg{height:155px;width:100%;margin-top:14px}
.aside-foot{font-size:10px;color:#97a084;margin-top:14px;padding-top:13px;border-top:1px solid #d8debd}
.gate-note{font-size:11px;color:#98765f;background:#f7eee5;padding:9px 12px;border-radius:10px;margin-top:12px}
.quiz-skip{display:block;font-size:11px;color:#93977e;margin:12px auto 0;text-decoration:underline;text-underline-offset:4px}
.report-shell{max-width:1000px;margin:auto;padding:0 32px}
.report-top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:31px 0 21px}
.report-breadcrumb{font-size:11px;color:#92977e;display:flex;gap:8px;align-items:center}
.report-actions{display:flex;gap:10px}
.report-actions .btn{font-size:12px;min-height:39px;padding:8px 15px;border-radius:11px}
.demo-banner{padding:11px 17px;background:#f3e5d7;border:1px solid #e7d5c2;display:flex;gap:12px;align-items:center;justify-content:space-between;border-radius:13px;font-size:11px;color:#987759;margin-bottom:16px}
.demo-banner button{text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.report-hero{display:grid;grid-template-columns:1.1fr 1fr;background:#edf0df;border:1px solid #d5ddbf;border-radius:30px;overflow:hidden;min-height:360px}
.report-hero.risk-tone{background:#eee7ec;border-color:#e1d6df}
.report-hero.observe-tone{background:#eeebe4;border-color:#e2dbcc}
.report-portrait-copy{padding:35px 0 29px 35px;z-index:1}
.report-label{font-size:10px;letter-spacing:1.2px;color:#839366;display:flex;gap:10px;align-items:center;margin-bottom:16px}
.tier-pill{display:inline-flex;padding:5px 12px;border-radius:100px;background:#fcfdf4b0;border:1px solid #d2dcc1;color:#6e7c55;font-size:10px}
.report-portrait-copy h1{font-size:41px;letter-spacing:-1.3px;font-weight:900;margin-bottom:15px}
.report-slogan{font-size:15px;line-height:1.9;color:#7e886c;max-width:350px}
.risk-tone .report-slogan{color:#8e798c}
.tag-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:19px}
.tag{background:#ffffff8a;border:1px solid #d9e0c9;padding:5px 10px;font-size:10px;white-space:nowrap;border-radius:100px;color:#8a9179}
.risk-tone .tag{border-color:#dfd4df;color:#968594}
.portrait-meta{margin-top:27px;font-size:10px;color:#a0a68f;display:flex;gap:13px;flex-wrap:wrap}
.report-art{display:flex;align-items:center;justify-content:center;padding:18px 10px 0 0}
.report-art>svg{width:110%;max-width:110%}
.report-tabs{display:flex;gap:30px;align-items:center;border-bottom:1px solid var(--line);margin:27px 0}
.report-tabs a{font-size:12px;padding:12px 0;color:#92977f}
.report-tabs a:first-child{color:#5d6f45;border-bottom:2px solid #9aac73;font-weight:600}
.report-overview{display:grid;grid-template-columns:.83fr 1.4fr;gap:22px;margin-bottom:25px}
.index-card,.chart-card{border:1px solid var(--line);border-radius:23px;background:var(--card);padding:25px}
.card-eyebrow{font-size:11px;color:#90967f;letter-spacing:.3px;display:flex;gap:8px;align-items:center}
.score-big{display:flex;gap:9px;align-items:baseline;margin:19px 0 9px;font-size:60px;font-weight:800;line-height:1.1;letter-spacing:-3px;color:#566641}
.score-big small{font-size:13px;font-weight:400;letter-spacing:0;color:#939b81}
.index-card h3{font-size:15px;margin-top:11px}
.index-card p{font-size:11px;color:#939781;line-height:1.9;margin-top:11px}
.score-unknown{font-size:27px;line-height:1.4;letter-spacing:0;margin-top:23px;color:#7b8168}
.cap-note{padding:10px 11px;border-radius:11px;background:#f5eadd;color:#a07d5e!important;font-size:10px!important}
.coverage-list{margin-top:17px;padding-top:15px;border-top:1px solid #e9eada}
.coverage-list span{display:block;font-size:11px;color:#a0a48e;margin:3px 0}
.chart-card h2{font-size:16px;margin-bottom:17px}
.dimension-row{display:grid;grid-template-columns:76px 1fr 73px;gap:13px;align-items:center;margin:12px 0;font-size:11px}
.dimension-value{text-align:right;font-size:10px;color:#939c7f}
.dimension-track{height:7px;background:#eeeee4;border-radius:20px;overflow:hidden}
.dimension-bar{height:100%;background:#acbf90;border-radius:20px}
.dimension-row.weak .dimension-bar{background:#c1afcc}
.dimension-row.unknown .dimension-track{background:repeating-linear-gradient(90deg,#e8e7df 0,#e8e7df 4px,transparent 4px,transparent 8px)}
.chart-note{font-size:10px;color:#a3a58f;margin-top:14px}
.notice-line{font-size:11px;color:#9a917f;background:#f1eee3;padding:12px 16px;border:1px dashed #dddcc8;border-radius:12px;margin:16px 0}
.boundary-notice{border-color:#e3ccb3;background:#f5ece1;color:#9e7a5c;padding:19px 21px;border-radius:16px;margin:20px 0}
.boundary-notice h3{font-size:13px;margin-bottom:9px}
.boundary-notice p{font-size:11px;line-height:1.9}
.evidence-list{font-size:11px;color:#997962;line-height:1.9;margin:10px 0 0;padding-left:18px}
.insight-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:23px 0}
.insight-card{background:#f9f7ee;border:1px solid #e2e3d2;border-radius:20px;padding:23px}
.insight-card .mini-label{font-size:10px;color:#939c7e;margin-bottom:10px}
.insight-card h3{font-size:16px;margin-bottom:10px}
.insight-card p{font-size:12px;line-height:1.95;color:#929783}
.action-card{display:flex;gap:18px;border:1px solid #d7dfc0;border-radius:21px;background:#eaf0d9;padding:23px 25px;margin:25px 0}
.action-icon{flex-shrink:0;width:37px;height:37px;border-radius:11px;background:#fffdf793;display:grid;place-items:center;color:#7f9160}
.action-card small{font-size:10px;color:#8e9a74}
.action-card h3{font-size:16px;margin:3px 0 8px}
.action-card p{font-size:12px;line-height:1.9;color:#788765}
.report-section{margin-top:40px;scroll-margin-top:20px}
.report-section .section-top{margin-bottom:18px}
.report-section .section-top h2{font-size:22px}
.dimension-details{background:var(--card);border:1px solid var(--line);border-radius:15px;margin:10px 0;overflow:hidden}
.dimension-details summary{display:flex;gap:16px;align-items:center;padding:18px 22px;cursor:pointer;list-style:none}
.dimension-details summary::-webkit-details-marker{display:none}
.detail-number{font-size:10px;color:#a3a88e}
.detail-title{font-size:14px;font-weight:600}
.detail-score{margin-left:auto;font-size:11px;color:#8b9775}
.detail-arrow{transition:transform .2s;color:#a1a887;transform:rotate(90deg)}
.dimension-details[open] .detail-arrow{transform:rotate(-90deg)}
.detail-body{padding:0 22px 23px;font-size:12px;line-height:2;color:#898f7b}
.detail-knowledge{padding:14px 17px;background:#f2f4e8;border-radius:11px;font-size:11px;margin-top:14px;color:#7e8b69}
.detail-knowledge strong{display:block;font-size:10px;font-weight:500;margin-bottom:4px;color:#a3ac91}
.detail-basis{font-size:10px;margin-top:12px;color:#acaf9d}
.style-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.style-card{padding:21px;background:#f7f5ee;border:1px solid #e1e1d1;border-radius:17px}
.style-status{display:inline-flex;padding:3px 8px;background:#e8ecdc;border-radius:100px;color:#919c7e;font-size:9px;margin-bottom:10px}
.style-card h3{font-size:14px;margin-bottom:9px}
.style-card p{font-size:12px;color:#929881;line-height:1.9}
.style-card small{font-size:10px;display:block;color:#aaa994;margin-top:8px}
.theory-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 23px}
.theory-item{border-top:1px solid var(--line);padding:17px 0}
.theory-item h3{font-size:13px;margin-bottom:7px}
.theory-item p{font-size:11px;line-height:1.9;color:#999d88}
.theory-item a{font-size:10px;color:#869569;text-decoration:underline;text-underline-offset:3px;display:inline-flex;margin-top:8px}
.theory-foot{font-size:10px;color:#a2a590;margin:15px 0}
.report-bottom{padding:28px;background:#e9edd8;border:1px solid #d7dfc0;border-radius:22px;margin-top:35px;display:flex;align-items:center;gap:25px;justify-content:space-between}
.report-bottom h3{font-size:18px;margin-bottom:6px}
.report-bottom p{font-size:12px;color:#8f997a}
.priority-card{background:#fffaf1;border:1px solid #e0d5bc;border-radius:25px;padding:35px;min-height:220px;margin-bottom:25px}
.priority-card .priority-label{font-size:11px;color:#a28d6e;margin-bottom:13px}
.priority-card h1{font-size:29px;margin-bottom:18px}
.priority-card p{font-size:14px;line-height:2;max-width:760px;color:#918269}
.priority-card small{display:block;font-size:11px;color:#a69a85;margin-top:20px}
.modal-backdrop{position:fixed;inset:0;background:#30332266;backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:24px;z-index:100}
.modal{background:var(--card);border:1px solid #d4d8c1;border-radius:27px;width:620px;max-width:100%;max-height:calc(100dvh - 48px);overflow:auto;box-shadow:0 30px 100px #21291430;padding:27px;position:relative}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}
.modal-head h2{font-size:20px}
.modal-close{width:31px;height:31px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;color:#92967f}
.modal-intro{font-size:12px;color:#959982;margin:-11px 0 19px;line-height:1.9}
.type-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.type-option{border:1px solid #e1e4d4;border-radius:12px;padding:15px 8px;text-align:center;background:#f2f5e8;min-height:78px}
.type-option.nf{background:#f3edf5;border-color:#e7dfec}
.type-option.sp{background:#f8f1df;border-color:#e7e0cc}
.type-option.sj{background:#eef2e3;border-color:#dfe7d0}
.type-option strong{font-size:17px;letter-spacing:.5px;display:block;line-height:1.3}
.type-option small{font-size:10px;display:block;margin-top:6px;color:#999d86}
.type-option.selected{outline:2px solid #94a876;outline-offset:-2px}
.type-option:hover{transform:translateY(-1px);box-shadow:0 5px 10px #41452a09}
.modal-foot{font-size:10px;color:#a3a58c;margin-top:17px;line-height:1.9}
.gallery-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.gallery-item{padding:17px;border:1px solid #e1e4d2;border-radius:14px;background:#f0f3e5}
.gallery-item.risk{background:#f4edf1;border-color:#e6dce1}
.gallery-item h3{font-size:14px;margin-bottom:6px}
.gallery-item p{font-size:10px;color:#9a9c86;line-height:1.8}
.gallery-item svg{height:92px;width:100%;margin:0 0 8px}
.theory-modal .theory-grid{display:block}
.confirm-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:23px}
.share-modal{width:566px}
.share-preview{max-width:315px;margin:0 auto 18px}
.share-preview>svg{display:block;width:100%;height:auto;border:1px solid #e7e4d7;border-radius:13px;box-shadow:var(--shadow)}
.share-controls{border-top:1px solid var(--line);padding-top:17px;margin-top:17px}
.checkbox-label{display:flex;gap:10px;align-items:center;font-size:11px;color:#929781;margin:8px 0 16px}
.checkbox-label input{width:16px;height:16px;accent-color:#7f9660}
.share-controls .btn{width:100%;margin-bottom:8px}
.share-privacy{font-size:10px;color:#a2a58f;text-align:center;line-height:1.8}
.report-bottom-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
/* 二维码分享 */
.share-qr{margin:22px 0 20px;border-top:1px solid var(--line);padding-top:19px}
.share-qr-title{display:flex;gap:8px;align-items:center;font-size:13px;color:#6f7a5c;font-weight:600;margin-bottom:12px}
.share-qr-tabs{margin:0 0 17px}
.share-qr-figure{width:198px;margin:0 auto;padding:11px;background:#fffdf7;border:1px solid #e7e4d7;border-radius:15px;box-shadow:var(--shadow)}
.share-qr-figure>svg{display:block;width:100%;height:auto}
.share-qr-hint{font-size:11px;color:#929781;text-align:center;line-height:1.8;margin:13px 0 14px}
.share-link-row{display:flex;gap:8px;align-items:stretch}
.share-link-input{flex:1;min-width:0;background:#f6f5ee;border:1px solid #e2e2d4;border-radius:11px;padding:9px 12px;font-size:11px;color:#7d826d;font-family:ui-monospace,Consolas,monospace;text-overflow:ellipsis}
.share-link-copy{flex:0 0 auto;min-height:40px;padding:8px 14px;font-size:11px;gap:7px}
.share-qr-empty{padding:17px;background:#f7f6ef;border:1px dashed #dedecf;border-radius:13px;text-align:center}
.share-qr-empty p{font-size:11px;color:#9a9c88;line-height:1.85}
.share-qr-empty p+p{margin-top:6px;color:#a9ab97}
.share-base{margin-top:16px;border:1px solid #e4e4d6;border-radius:13px;padding:0 14px;background:#fbfaf4}
.share-base[open]{padding-bottom:14px}
.share-base summary{font-size:11px;color:#8d9377;padding:12px 0;cursor:pointer;list-style:none}
.share-base summary::-webkit-details-marker{display:none}
.share-base summary:before{content:"▸";display:inline-block;margin-right:7px;transition:transform .15s}
.share-base[open] summary:before{transform:rotate(90deg)}
.share-base .field-label{margin:2px 0 6px}
.share-base-input{width:100%;background:#fffdf9;border:1px solid #dce0d0;border-radius:11px;min-height:42px;padding:9px 11px;font-size:12px}
.share-base-note{font-size:10px;color:#a2a58f;line-height:1.8;margin-top:8px}
.share-base-note.warn{color:#a8814f}
/* 好友打开分享链接后的只读视图 */
.shared-hero{text-align:center;padding:56px 0 26px;max-width:660px;margin:0 auto}
.shared-hero h1{font-size:34px;letter-spacing:-.8px;margin-bottom:14px}
.shared-lede{font-size:13px;color:var(--muted);line-height:1.9}
.shared-card{display:grid;grid-template-columns:1.05fr 1fr;background:#edf0df;border:1px solid #d5ddbf;border-radius:30px;overflow:hidden;min-height:330px}
.shared-card.risk-tone{background:#eee7ec;border-color:#e1d6df}
.shared-card.observe-tone{background:#eeebe4;border-color:#e2dbcc}
.shared-copy{padding:38px 0 32px 38px}
.shared-copy h2{font-size:38px;letter-spacing:-1px;margin-bottom:13px}
.shared-art{display:flex;align-items:center;justify-content:center;padding:12px}
.shared-art>svg{width:100%;height:290px}
.shared-scope{margin:30px 0 20px;padding:26px 28px;border:1px solid var(--line);border-radius:22px;background:#faf8f1;display:grid;grid-template-columns:1fr 1fr;gap:30px}
.shared-scope h3{font-size:15px;margin-bottom:12px}
.shared-scope ul{margin:0;padding-left:18px}
.shared-scope li{font-size:12px;color:#8d927c;line-height:1.95}
.shared-scope p{font-size:12px;color:#8d927c;line-height:1.95;margin-bottom:16px}
#toast{position:fixed;bottom:30px;left:50%;transform:translate(-50%,20px);background:#3c4632;color:#fffdf4;border-radius:12px;padding:12px 18px;font-size:12px;box-shadow:var(--shadow);z-index:220;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 35px);white-space:normal;text-align:center}
#toast.visible{opacity:1;transform:translate(-50%,0)}
.fade-in{animation:enter .3s ease both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  window.addEventListener('load', function () {

面却一直没定时间","action":"一次只确认一个小承诺，并说明何时落实。"}}}],"answer_labels":{"1":"完全不符合","2":"比较不符合","3":"一半符合，一半不符合","4":"比较符合","5":"非常符合","U":"没发生过／不了解"},"onboarding":{"mbti_A":"标准流程填写16种类型之一；记录A自述/既往结果/由B猜测；无类型可探索但不生成组合底图","mbti_B":"标准流程填写16种类型之一；记录自测来源/暂不确定；无类型可探索但不生成组合底图","nickname":"可不填真实姓名，默认A与我","relationship_stage":["暗恋但已有互动","刚认识/在了解","暧昧","已确认交往","长期伴侣"],"no_interaction":"几乎没有真实互动时，提供探索档案，不出适配指数和段位","duration":["不足1个月","1—3个月","3—12个月","1年以上"],"interaction_period":"最近4周；不足4周则按认识以来，并标短观察窗口","focus":"可选最想了解的1个维度，仅用于相近分数下选文案，不影响分数","major_context":"可选近期加班/考试/照护/求职等；仅提示背景，不自动加减分"},"scoring":{"positive":"x","reverse":"6-x","missing":"exclude; never impute by MBTI or midpoint","dimension_score":"25*(mean(valid_recoded_answers)-1)","minimum_valid_per_dimension":6,"minimum_observed_A":1,"minimum_dyad":2,"minimum_core_direction_valid":1,"core_direction_ids":["D8-03","D8-05"],"global_score":"unweighted mean of all 8 eligible dimension scores","global_requires":"8维均合格；至少48/64有效；资料不足不出总分和段位","rounding":"阈值判定用未四舍五入值；展示按half-up四舍五入一位小数与分字，不用百分号","caps":["D4<40最高L2","D3或D6或D8<40最高L3","D4-07或D4-08原始回答>=4，最高L2且单列边界问题","D8-03或D8-05原始回答<=2，最高L3且优先方向分歧解释"],"boundary_override":"H1/H2/H3任一yes，不出总指数、段位及趣味画像；保留私密维度记录","intent_override":"H4=yes，不出追求适配指数或段位，显示尊重明确意愿","unknown_gates":"unknown不是no；允许报告继续，显著标注边界与意愿仍有未确认项","response_quality":"48题以上所有有效回答选同一档，仅提示复核，不能断定作假或恋爱脑","archetype_selection":"边界题触发优先R-D4，其次方向核心低分优先R-D8；否则最弱维<55或最高最低差>=20选R-最弱维；否则选S-最高维；3分内优先用户关注维，最后按D1..D8固定顺序","all_cutoffs":"均为V1产品定义，必须经预测试及验证后修订；无研究直接证明这些阈值"}},"copy":{"version":"draft-1.0","status":"原创产品表达，具体话术不是经验证干预处方","dimensions":[{"id":"D1","name":"情绪回应","high":"你描述的相处里，讲完加班受气的事，往往能得到接续的回应。被理解不等于马上解决问题；这可能让你更愿意表达。可以保留一句暗号：“我现在想先被听完，再一起想办法。”","mid":"同样是吐槽加班，有时你想要安慰，收到的却是解决方案。这可能是支持方式没对上。下次先说：“我想讲五分钟，你先听；讲完再帮我想办法，好吗？”观察回应是否更贴近你的需要。","low":"如果低分主要来自想继续倾诉却被结束话题，可以先核对当时是否说清了需要；这类经历可能让人难以感到被接住。你可以说：“我希望先把这件事讲完。”随后观察实际回应，不必独自撑起每次交流。","unknown":"你们可能还没经历过真正的倾诉，也可能你暂时不愿表达。现有回答不足以判断情绪支持。若愿意，可以分享一件不太私密的小烦恼，说明想被倾听，再观察是否能说完、后续是否被记得。","knowledge":"“感知伴侣回应”关注你是否感觉被理解、被认可、被关心，不要求对方总赞同你。一次回应只是线索；本维描述的是B的体验，不能由此读取A的内心。"},{"id":"D2","name":"沟通翻译","high":"当一句“随便”让人摸不准时，你描述的互动中有机会核对意思。文字缺少语调，主动确认能减少把猜测当事实。继续用：“你是都可以，还是现在不方便选？我想确认一下。”给回答留出空间。","mid":"你们可能面对面聊得顺，却在微信里误会一个“嗯”。文字缺少语调，双方容易补上各自的解释。可以把一次含糊回复改成确认：“我读起来有点像你不开心，是我理解偏了吗？”再听具体回答。","low":"你的回答提示，表达可能常卡在“你应该懂”或“你就是这个意思”。这会让需要被猜测代替。试着只说一个具体请求：“今晚方便陪我聊十分钟吗？”观察请求能否被明确回应，也接受对方说不方便。","unknown":"目前你们可能聊得还浅，尚未遇到明显误会；这不足以说明沟通一定顺畅。下次选餐厅或约时间时，把一个具体偏好讲清楚，看看能否相互确认。先积累真实互动，别用MBTI替对方补完整句。","knowledge":"“核对理解”是把自己的解释当作待确认的信息。具体请求比让人猜心更容易回应；对方能够理解请求，也仍然有权拒绝。文字交流中的语气判断尤其需要核实。"},{"id":"D3","name":"冲突修复","high":"一次见面安排出了岔子后，你描述的互动通常能回到具体问题，并谈出下次做法。修复的线索在于后续有没有变化。可以保留：“下次临时改时间，我们最晚什么时候告诉对方？”让约定足够具体。","mid":"你们可能吵完能重新聊天，但原来的问题偶尔还会回来。恢复气氛与解决分歧是两件事，约定太模糊时尤其如此。平静后补一句：“这次我们各改一件什么事？”再看下次同类情境有没有调整。","low":"如果低分来自翻旧账或恢复闲聊后仍搁置问题，可先对照最近一次具体分歧。若双方愿意且互动安全，约好暂停与重谈时间，只讨论这一次。修复看后续行动，也需要双方参与，不能由你独自承担。","unknown":"你们也许还没遇过明显分歧，没吵架暂时不能证明修复能力。可以在自然出现的小分歧里，观察是否能把意见说完整、是否有后续约定。无需故意制造矛盾；等真实情境出现，再补充这块画像。","knowledge":"修复可以包括承认具体影响、把谈话带回问题和落实下一步。暂停与恢复闲聊不自动等于解决分歧。本产品更关注安全、双方愿意、约定清楚以及后续行为变化。"},{"id":"D4","name":"边界尊重","high":"你描述的互动里，说“不想去”或“想自己待会儿”通常能被接纳。能够保留选择，会让相处更少依赖压力。继续把界限说具体：“这次我不参加，周末再约。”也把同样的拒绝空间留给对方。","mid":"有些界限能说清，但拒绝一次邀约时，你可能仍要反复解释。双方对界限的理解可能还没一致。可以说：“我已经决定这次不去，希望这件事就停在这里。”观察拒绝是否被尊重；明确拒绝应被接纳。","low":"本维低分需要对照具体答案，看拒绝、独处或隐私中的哪一处没有被尊重。未讨论的安排可以确认；已经明确表达的拒绝，无需反复证明。若有威胁、强迫或持续控制等具体经历，应由独立边界说明优先处理。","unknown":"如果还没出现拒绝邀约、独处或隐私分享的情境，这一维应保留为待观察。下次自然需要休息时，可以平静说明自己的安排，观察拒绝是否被接纳。不要通过故意激怒或试探对方来验证界限。","knowledge":"边界涉及身体、隐私、时间与社交的自主选择，关系亲近不会取消拒绝权。严重侵害需要独立处理；本维高分和总分都不能抵消威胁、强迫、跟踪或暴力等具体事件。"},{"id":"D5","name":"联络节奏","high":"你的回答里，联系频率与独处空间大体合拍，忙过一阵后也能接回话题。稳定的预期可能让你更踏实。继续说清：“这周晚上忙，周六再见面好吗？”让节奏有约定，也允许彼此提出调整。","mid":"你可能愿意接受晚回消息，却受不了不知道何时再聊。联络的不确定感有时会放大落差。可以问：“忙的时候要不要简单说一声？我们大概什么时候再联系？”再看这个安排是否适合双方。","low":"你的回答提示，商量后目前的联系频率或见面安排仍让你不舒服。先分别记下实际联络和自己的期待，避免把晚回都解释成态度。可提出一个能接受的节奏；多次说清仍无法协调，就需要重新评估。","unknown":"你们可能刚认识、互动太少，或最近特别忙，暂时还看不出稳定节奏。可以记录一周实际联系与见面安排，连同加班、上课等已知条件一起看。只记可观察的事实，不用在线状态推断对方在想什么。","knowledge":"联络节奏包含联系需求、独处空间和安排是否可预期。偏好不同本身不减分；本产品观察的是双方能否协调出可接受的节奏，以及B在实际互动中的舒适程度。"},{"id":"D6","name":"投入互惠","high":"从你的回答看，主动联系和安排见面大体有来有回，你也承受得住自己的投入。公平可以是不同分工，无需逐笔结算。继续说一句具体感谢：“你昨天主动来问我，让我轻松不少。”同时保留各自的能力范围。","mid":"你可能觉得A也有回应，但约好的联系安排常落在同一边。分担是否公平，和礼物金额并不完全一样。可以只谈一件具体分工：“下次见面能请你来定时间吗？”观察是否出现实际参与，而非只听承诺。","low":"你的回答里，维持联系可能已让你疲惫，或你担心不主动就会断掉。这个担忧不足以认定A的心意。先把投入调回自己能承受的范围，提出一次具体分担请求，再观察回应，不用加码付出换承诺。","unknown":"如果你们还没有互相求助或共同安排过见面，目前不足以判断投入是否有来有回。自然出现一个小需求时，可以清楚提出，允许对方拒绝，再观察有无回应。无需故意消失，也不必用红包制造人情债。","knowledge":"互惠关注支持与回应是否可持续，以及B对分担是否公平的体验。双方的方式可以不同；投入多不自动高分。自愿付出与担心失去联系而勉强承担，需要分别看待。"},{"id":"D7","name":"日常协作","high":"从餐厅预算到谁订票，你描述的相处通常能落到具体安排，这会减少临时猜测和责任模糊。活动前继续说清：“这次预算多少，钱怎么分，谁负责订？”AA、轮流请客或自愿请客，都可以共同协商。","mid":"你们可能喜欢一起出门，却在价位、路线或谁来安排上偶尔卡住。消费习惯不同，不必直接解释成人品差异。下次把问题拆小：“我这次预算一百元，我们选哪家？”先解决这一次，再观察是否愿意协调。","low":"你的回答提示，共同活动可能让你超预算、压下偏好，或反复承担临时事务。先把限制讲具体，只答应负担得起的部分。若表达后仍持续被忽略，可减少共同开销与任务，不必靠一直迁就维持气氛。","unknown":"你们可能还没有共同消费或安排过出行，这块暂时缺少证据。若双方都愿意，可以从一次低成本、容易取消的小活动观察预算协商与责任分担。别为了测试适配，直接安排昂贵旅行或共同负债。","knowledge":"日常协作关注能否把偏好、资源限制和责任变成可执行安排。消费金额不是道德分数；自愿分工与默认由一人兜底，应区别观察。不需要同居才能了解这些协作方式。"},{"id":"D8","name":"现实方向","high":"你记录的现阶段方向，有一部分已经被明确表达且能被你接受。其他议题是否也有共同安排，还要分别看具体答案。可以核对：“我们现在仍愿意按已经说过的安排继续吗？”共识需要随生活更新，不等于未来保证。","mid":"你们可能对现在相处感到舒服，但公开程度、城市去向或承诺时间还需要协调。这些是不同的现实议题。一次只聊一件：“如果明年异地，你能接受哪些安排？”听清答案后，再看是否有共同空间。","low":"你的回答提示，已表达的关系目标或推进时间，商量后仍有难以协调的分歧。先确认原话和自己的底线。若A明确不想发展关系，应尊重这份答案；你可以调整投入，把自己的生活计划继续往前推。","unknown":"如果关系方向、公开程度或城市安排还没聊过，这里应显示待了解。未表白、未见家长或没有婚育计划都不自动减分。只有在双方愿意时，询问当前关系期待；暂时不知道，也比替对方填理想答案可靠。","knowledge":"方向适配是已表达的期待能否相容，不要求同样的人生模板。关系目标、公开方式、城市安排和承诺节奏应分别核对；明确拒绝不能被其他维度的高分抵消。"}],"archetypes":[{"id":"S-D1","name":"情绪接球搭子","one_liner":"开心有人接，难受也有地方慢慢说。","tags":["认真听完","关心有后续","安慰合需要"],"mascot_scene":"两只原创圆润饭团小角色坐在柔软矮垫上，一只把小云朵形的情绪球轻轻递出，另一只张开双手接住；旁边有一颗代表好消息的小星星。奶油白、杏黄和浅粉，简洁表情，原创构图。","paragraph":"从你的回答看，这段互动里，烦心事有机会被听完，开心事也能收到回应。你们正在积累一种具体的支持经验：不急着按自己的习惯安慰，而是确认此刻怎样做更有帮助。这一优势可以继续保持，尤其是把一次关心延伸到事后的跟进。","action":"下次有人想倾诉时，先问一句：“你现在想让我听你说，还是一起想办法？”"},{"id":"S-D2","name":"双向翻译搭子","one_liner":"一个“嗯”，也可以问清楚再续聊。","tags":["期待说清楚","歧义能确认","文字有补充"],"mascot_scene":"两只原创圆润玩偶各举一张不同形状的对话气泡，一起把气泡放进一台小小的翻译盒，出来的是一张双方都能看清的纸条；使用淡紫和湖蓝点色，不出现手机品牌或既有角色。","paragraph":"你的回答显示，你们遇到含糊表达时，比较能补充说明，而不是让微信里的一个句号承担整段关系的解释。这样的沟通把“我想表达什么”和“你听到什么”之间的距离缩短了。它不要求时时在线，只需要在重要的误会出现时，愿意再确认一次。","action":"遇到语气误会时，试着复述：“我刚才理解成了……你原本想说的是这个吗？”"},{"id":"S-D3","name":"关系补丁搭子","one_liner":"意见可以不同，修复可以有下文。","tags":["对事表达","暂停有约定","调整看行动"],"mascot_scene":"两只原创圆润饭团小角色共同修补一张因折痕翘起的小地图，各贴上一块不同颜色的圆角补丁，桌边放着一只计时沙漏；温暖橙色与雾蓝，轻松但不展示攻击或破碎身体。","paragraph":"你回忆的分歧里，双方比较能围绕具体事情说话，也有机会在暂停之后回到问题。值得保留的是这些可观察的修复动作：说清哪里不合适、承担自己的部分、约定下一次怎么做。关系的补丁来自后续行动，每次小调整都可以成为新的相处经验。","action":"一次分歧谈完后，共同留下一条具体约定：“下次遇到这件事，我们先这样做。”"},{"id":"S-D4","name":"有门铃的亲密","one_liner":"靠近有邀请，拒绝也能被听见。","tags":["拒绝被尊重","隐私先确认","独处有空间"],"mascot_scene":"两只原创圆润玩偶各住在一间并排的小屋里，一只在门外按门铃，另一只从门内打开窗户回应；屋间有共同的小花园，门保持完整，色彩为浅绿和奶油白，不用锁链或围栏暗示控制。","paragraph":"你的回答里，拒绝、独处和不想公开的信息，比较能够得到尊重。这样的日常体验给亲近留出了选择的空间：能说愿意，也能说暂时不愿意。可以继续保留的习惯是把同意落实到每次具体情境，尤其是转发聊天、公开信息和邀请参加活动之前。","action":"涉及对方的聊天或个人信息时，先确认一句：“这部分可以给别人看吗？”"},{"id":"S-D5","name":"各忙各的同频","one_liner":"日程不必一样，联系可以有着落。","tags":["忙时能交代","节奏可协商","重连有着落"],"mascot_scene":"两只原创圆润饭团小角色分别坐在小书桌与通勤小车旁，各自做事；两张日历之间用一条柔软波浪线连接，在约好的小时间格上出现同色星点。雾蓝、浅黄与留白，不表现全天监视。","paragraph":"从你描述的互动看，各自忙的时候，联系和见面的安排比较有着落。你们未必拥有同一份作息，却能通过交代、协商和之后的重新连接，减少等待中的猜测。这种同频来自可执行的安排，也允许加班、备考和临时变化成为真实生活的一部分。","action":"挑一个双方都方便的时段，约定一件轻量的固定联系方式，并说明忙时怎么调整。"},{"id":"S-D6","name":"双向续杯搭子","one_liner":"关系里的下一杯，有人接着添。","tags":["主动有来回","付出被看见","分工可调整"],"mascot_scene":"两只原创圆润玩偶围坐小桌，一只添温水，另一只递小点心，桌中央放一张可以轮流翻面的值日小卡；用浅咖与桃粉配色，杯中无酒精，画面呈现不同形式的互相照应。","paragraph":"你的回答呈现出一定的来回：联系、安排和照应，不总是由同一个人承担。双方付出的形式可以不同，有人擅长主动邀约，有人善于记住细节。值得继续保持的是看见这些具体投入，并在某个人忙碌或吃力时重新分配，让关系的维持有接力。","action":"回顾最近一次见面各自做了什么，商量下一次由谁接手其中一项安排。"},{"id":"S-D7","name":"人间合伙搭子","one_liner":"从约会小事里，练习一起办成事。","tags":["安排能落地","难题有协商","责任说具体"],"mascot_scene":"两只原创圆润饭团小角色一起整理一只周末出行小篮子，一只查看路线卡，另一只放入雨伞，桌面还有明确分格的小清单；奶油白和砖红点色，保持生活化，不出现同居或婚姻符号。","paragraph":"你回忆的共同安排里，想法比较能落到具体行动。无论是约见地点、周末出行还是临时改计划，双方有机会讨论限制、承担一部分工作，并在变化出现时重新协商。这种协作经验来自日常小事，也让你能够观察到一起处理实际问题时的相处方式。","action":"下次共同安排一件小事时，把“谁负责哪一步”和“变化时怎么通知”各说清一次。"},{"id":"S-D8","name":"同路地图搭子","one_liner":"心动有坐标，方向有话可说。","tags":["方向能谈","期待可接受","现实有讨论"],"mascot_scene":"两只原创圆润玩偶站在摊开的城市地图旁，各自持一枚不同颜色的定位小旗，手指指向一段愿意共同走的路线；用浅绿与杏橙，路线保留分岔，不画命中注定的红线。","paragraph":"从你的回答看，关系方向和部分现实安排已经有过表达，A说出的期待与你能够接受的方向有一定交集。这样的交集值得珍惜，也需要随着生活变化继续确认。当前能谈清楚的内容，是你理解这段关系的重要信息，还不能替代未来双方具体的选择。","action":"选一项双方已经谈过的方向，确认目前是否仍愿意按这个安排继续。"},{"id":"R-D1","name":"安慰错频道","one_liner":"心事已经发出，回应还在找频道。","tags":["需要待确认","先听一会儿","关心再跟进"],"mascot_scene":"两只原创圆润饭团小角色坐在小收音机两侧，各自手里的温柔对话气泡落在不同刻度上，桌中央有可一起旋转的调频旋钮；淡粉和浅黄，不画嘲笑、忽视或诊断符号。","paragraph":"你记录的互动里，情绪表达和回应方式还没有稳定地对上。可能是想先说完，却很快收到建议；也可能开心事说了，话题没有继续。先对照具体答案看看发生了什么，再把当时需要的回应说得更明确。支持是否合用，可以从实际的后续变化中观察。","action":"下次倾诉前先说一句：“我想先讲完，今天最需要你这样回应……”"},{"id":"R-D2","name":"已读待翻译","one_liner":"一个句号，先别让它写完整部剧情。","tags":["意思待核实","期待说具体","换种方式聊"],"mascot_scene":"两只原创圆润玩偶看着几张带有句号和问号的小纸片，各自手里有一张尚未对上的说明卡，中央留出一块共同填写的空白；浅紫和灰蓝，保留好奇表情，不表现愚笨或恶意。","paragraph":"你回忆的互动中，含糊说法或文字语气容易留下多种解释，有些期待也还没有直接说出来。微信缺少语调，一个“嗯”很容易多出几段剧情。可以先把观察到的原话和自己的理解分开，再请对方确认；重要的事，也可以换到双方方便的沟通方式里谈。","action":"挑一句最近让你困惑的原话，问：“我理解成了……你具体想表达什么？”"},{"id":"R-D3","name":"暂停未续播","one_liner":"聊天恢复了，那件事还等一个下文。","tags":["问题待回访","暂停约时间","修复看行动"],"mascot_scene":"两只原创圆润饭团小角色坐在小幕布前，幕布上是一张停在中间的待办卡，旁边摆着可预约时间的小钟；米白和雾橙，画面平静，不把争执画成打斗或把长期伤害画成游戏。","paragraph":"你的回答提示，分歧之后的回到问题或后续调整，还不够稳定。有些事情可能恢复了聊天，却没有继续处理双方已经认定重要的部分。暂停可以帮助缓一缓，也需要可执行的返回安排。请从最近一次具体分歧观察，看看约定有没有下文、行为有没有变化。","action":"对一件双方仍愿意处理的分歧，约一个具体时间，只讨论下一次怎样做。"},{"id":"R-D4","name":"边界先讲清","one_liner":"拒绝和隐私，需要落实到具体尊重。","tags":["拒绝需尊重","私事先征询","按具体事处理"],"mascot_scene":"两只原创圆润玩偶分别站在自己的个人空间旁，手中各持一张清晰的界限说明卡，中央桌面摆放一枚询问许可的圆形按钮；中性米白和浅绿，认真平静，不画破门、施压、受伤或把侵犯边界表现成俏皮互动。","paragraph":"你记录的互动中，拒绝是否被接受、私事是否按约定保留，还有需要认真处理的地方。边界是对自身时间、信息和选择的决定，不是用来换取好感的筹码。请先对照具体答案，分清未讨论的规则与已经表达却仍被越过的界限，再观察对方的实际回应。","action":"确认一条具体边界及其是否被尊重；已经明确表达的拒绝，无需反复证明。"},{"id":"R-D5","name":"时差小行星","one_liner":"都有日程，联系还在找共同时间。","tags":["联系待约定","忙时有交代","变化能重排"],"mascot_sce   <script>
(function (root) {
  'use strict';

  // V1 product rules, ported from the reviewed Python reference. These cutoffs
  // are product definitions; they are not a validated psychological scale.
  const GATE_IDS = ['H1', 'H2', 'H3', 'H4'];
  const DIRECTION_IDS = ['D8-03', 'D8-05'];
  const BOUNDARY_IDS = ['D4-07', 'D4-08'];

  function getRules(supplied) {
    const rules = supplied || (root.HEPAI_CONTENT && root.HEPAI_CONTENT.rules);
    if (!rules) throw new Error('Scoring rules are not loaded');
    return rules;
  }

  function tierForIndex(value) {
    if (typeof value !== 'number' || !Number.isFinite(value) || value < 0 || value > 100) {
      throw new RangeError('Index must be between 0 and 100');
    }
    return value < 40 ? 1 : value < 55 ? 2 : value < 70 ? 3 : value < 85 ? 4 : 5;
  }

  // Round the decimal representation, like Decimal(str(value), HALF_UP),
  // instead of relying on toFixed's binary rounding (81.25 must display 81.3).
  function displayScore(value) {
    if (value === null || value === undefined) return '待了解';
    if (typeof value !== 'number' || !Number.isFinite(value)) {
      throw new TypeError('Display score must be a finite number or null');
    }
    const negative = value < 0 || Object.is(value, -0);
    const [mantissa, exponentText] = Math.abs(value).toString().toLowerCase().split('e');
    const exponent = Number(exponentText || 0);
    const [whole, fractional = ''] = mantissa.split('.');
    const digits = whole + fractional;
    const point = whole.length + exponent;
    const unitsEnd = point + 1;
    let unitsText;
    let roundingDigit;
    if (unitsEnd <= 0) {
      unitsText = '0';
      roundingDigit = unitsEnd === 0 ? digits[0] : '0';
    } else if (unitsEnd >= digits.length) {
      unitsText = digits + '0'.repeat(unitsEnd - digits.length);
      roundingDigit = '0';
    } else {
      unitsText = digits.slice(0, unitsEnd);
      roundingDigit = digits[unitsEnd];
    }
    let units = BigInt(unitsText || '0');
    if (Number(roundingDigit) >= 5) units += 1n;
    const rounded = units.toString().padStart(2, '0');
    return (negative ? '-' : '') + rounded.slice(0, -1) + '.' + rounded.slice(-1);
  }

  function evaluate(answers, gates, focus, suppliedRules) {
    const rules = getRules(suppliedRules);
    const questions = rules.core_questions;
    const knownIds = new Set(questions.map(question => question.id));
    if (!answers || typeof answers !== 'object' || Array.isArray(answers)) {
      throw new TypeError('Answers must be an object');
    }
    if (Object.keys(answers).some(id => !knownIds.has(id))) {
      throw new RangeError('Unknown question ID');
    }
    for (const value of Object.values(answers)) {
      if (value === null || value === 'U') continue;
      if (!Number.isInteger(value) || value < 1 || value > 5) {
        throw new RangeError('Answers must be integer 1..5, null or U');
      }
    }
    gates = gates || {};
    if (typeof gates !== 'object' || Array.isArray(gates)) throw new TypeError('Gates must be an object');
    if (Object.keys(gates).some(id => !GATE_IDS.includes(id))) {
      throw new RangeError('Unknown gate ID');
    }
    if (Object.values(gates).some(value => !['yes', 'no', 'unknown'].includes(value))) {
      throw new RangeError('Gate answers must be yes/no/unknown');
    }

    const directionItems = DIRECTION_IDS.filter(id => Number.isInteger(answers[id]) && answers[id] <= 2);
    const dimensions = {};
    for (const dimension of rules.dimensions) {
      const pool = questions.filter(question => question.dimension === dimension.id);
      const valid = pool.filter(question => Number.isInteger(answers[question.id]));
      const counts = {};
      for (const question of valid) counts[question.perspective] = (counts[question.perspective] || 0) + 1;
      let eligible = valid.length >= rules.scoring.minimum_valid_per_dimension &&
        (counts.A_observed || 0) >= 1 && (counts.dyad || 0) >= 2;
      const directionCoreMissing = dimension.id === 'D8' &&
        !DIRECTION_IDS.some(id => Number.isInteger(answers[id]));
      if (directionCoreMissing) eligible = false;
      const values = valid.map(question => question.reverse ? 6 - answers[question.id] : answers[question.id]);
      const score = eligible ? 25 * (values.reduce((sum, value) => sum + value, 0) / values.length - 1) : null;
      dimensions[dimension.id] = {
        name: dimension.name,
        valid: valid.length,
        total: pool.length,
        perspective_counts: counts,
        score,
        band: score === null ? 'unknown' : score >= 75 ? 'high' : score >= 50 ? 'mid' : 'low',
        eligibility_note: directionCoreMissing ? '缺少现阶段关系目标的直接依据' : null,
        interpretation_override: dimension.id === 'D8' && directionItems.length ? 'direction_core_mismatch' : null
      };
    }

    const warnings = BOUNDARY_IDS.filter(id => Number.isInteger(answers[id]) && answers[id] >= 4);
    const answered = Object.values(answers).filter(Number.isInteger);
    const result = {
      perspective: 'B_only',
      period: 'past_4_weeks',
      dimensions,
      coverage: answered.length + '/64',
      raw_index: null,
      tier: null,
      tier_before_cap: null,
      archetype_id: null,
      status: null,
      cap_reasons: [],
      boundary_items: warnings,
      response_pattern_review: answered.length >= 48 && new Set(answered).size === 1,
      direction_items: directionItems,
      unanswered_gates: GATE_IDS.filter(id => (gates[id] || 'unknown') === 'unknown')
    };

    // These reports take precedence over ordinary scores and playful types.
    if (GATE_IDS.slice(0, 3).some(id => gates[id] === 'yes')) {
      result.status = 'boundary_priority';
      return result;
    }
    if (gates.H4 === 'yes') {
      result.status = 'stated_no';
      return result;
    }
    if (Object.values(dimensions).some(dimension => dimension.score === null)) {
      result.status = 'observation';
      return result;
    }

    result.status = 'scored';
    const scores = Object.fromEntries(Object.entries(dimensions).map(([id, dimension]) => [id, dimension.score]));
    const scoreValues = Object.values(scores);
    const mean = scoreValues.reduce((sum, value) => sum + value, 0) / 8;
    result.raw_index = mean;
    let tier = tierForIndex(mean);
    result.tier_before_cap = tier;
    const limits = [];
    if (scores.D4 < 40) limits.push([2, '边界尊重低于40分']);
    for (const id of ['D3', 'D6', 'D8']) {
      if (scores[id] < 40) limits.push([3, dimensions[id].name + '低于40分']);
    }
    if (warnings.length) limits.push([2, '拒绝后施压或隐私边界题需要单列处理']);
    if (directionItems.length) limits.push([3, '现阶段关系方向核心题尚未对齐']);
    for (const [maximum, reason] of limits) {
      if (tier > maximum) result.cap_reasons.push(reason);
      tier = Math.min(tier, maximum);
    }
    result.tier = tier;

    const low = Math.min(...scoreValues);
    const high = Math.max(...scoreValues);
    const needsAttention = low < 55 || high - low >= 20 || warnings.length > 0 || directionItems.length > 0;
    let selected;
    if (warnings.length) {
      selected = 'D4';
    } else if (directionItems.length) {
      selected = 'D8';
    } else {
      const candidates = Object.keys(scores).filter(id => needsAttention ? scores[id] <= low + 3 : scores[id] >= high - 3);
      // The lowest/highest exact score wins by D1..D8 order; a focus can only
      // change the copy when it falls within three points of the same extreme.
      selected = candidates.includes(focus) ? focus : Object.keys(scores).find(id => scores[id] === (needsAttention ? low : high));
    }
    result.archetype_id = (needsAttention ? 'R-' : 'S-') + selected;
    result.near_tie = high - low < 5;
    return result;
  }

  function narrateStyles(mbtiA, mbtiB, confirmations, suppliedRules) {
    const rules = getRules(suppliedRules);
    const types = new Set(rules.mbti_characters.map(character => character.type));
    if (!types.has(mbtiA) || !types.has(mbtiB)) {
      throw new RangeError('MBTI must be one of the 16 supported four-letter types');
    }
    confirmations = confirmations || {};
    return rules.style_axes.map((axis, index) => {
      const actual = [];
      let contextDependent = false;
      for (const role of ['B', 'A']) {
        const value = confirmations[role + '_' + axis.id];
        if (value !== undefined && value !== null && !['unknown', 'context', ...axis.letters].includes(value)) {
          throw new RangeError('Invalid style confirmation');
        }
        if (value === 'context') contextDependent = true;
        actual.push(axis.letters.includes(value) ? value : null);
      }
      if (contextDependent) {
        return {
          axis: axis.id,
          status: 'context_dependent',
          key: null,
          text: '你们至少一人的实际偏好随情境变化。针对这一次安排，各自说清当前需要，再一起协商。',
          note: '不按MBTI补出固定倾向。'
        };
      }
      if (actual.every(Boolean)) {
        const key = actual.join('');
        return {axis: axis.id, status: 'checked', key, text: axis.modules[key].prompt};
      }
      const key = (actual[0] || mbtiB[index]) + (actual[1] || mbtiA[index]);
      return {
        axis: axis.id,
        status: actual.some(Boolean) ? 'partially_checked' : 'hypothesis_only',
        key,
        text: axis.modules[key].prompt,
        confirmed_sides: ['B', 'A'].filter((role, side) => Boolean(actual[side])),
        unknown_sides: ['B', 'A'].filter((role, side) => !actual[side]),
        note: '保留已核对一侧的实际习惯；未知一侧仅作条件式讨论提示，不能当作已观察事实。'
      };
    });
  }

  const api = Object.freeze({evaluate, narrateStyles, displayScore, tierForIndex});
  root.HEPAI_ENGINE = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof globalThis !== 'undefined' ? globalThis : window);
  </script>

  const ARCHETYPE_PATTERN = /^[SR]-D[1-8]$/;

      if (b1 === undefined) break;
      out += B64[((b1 & 15) << 2) | (b2 === undefined ? 0 : b2 >> 6)];
      if (b2 === undefined) break;
      out += B64[b2 & 63];

  function saveShareSettings() {
    try {

    } catch (_) {}
  }
  function pageBase() {
    try {
      const url = new URL(location.href);
      if (url.protocol !== 'http:' && url.protocol !== 'https:') return '';
      url.hash = ''; url.search = '';
      url.pathname = url.pathname.replace(/[^/]*$/, '');
      return url.href.replace(/\/+$/, '') + '/';
    } catch (_) { return ''; }
  }
  /** 网址里带这类参数，多半是限时的预览/访问链接，别人打开会直接报错。 */
  function looksTemporary(value) {
    return /(^|[?&])(eo_token|eo_time|access_token|token|sign|signature|_t)=/i.test(value || '');
  }
  function shareBaseUrl() {
    const raw = (shareBase || pageBase()).trim();
    if (!raw || !/^https?:\/\//i.test(raw)) return '';
    try {
      // 只保留协议+域名+目录，丢掉查询串和锚点：粘贴带参数的完整地址或
      // index.html 进来时，都要归成能直接拼 #s= 的形式。
      const url = new URL(raw);
      url.hash = ''; url.search = '';
      url.pathname = url.pathname.replace(/[^/]*$/, '');
      return url.href.replace(/\/+$/, '') + '/';
    } catch (_) { return raw.replace(/\/+$/, '') + '/'; }
  }
  function baseIsLocal(base) {
    try {
      const host = new URL(base).hostname.toLowerCase();
      return host === 'localhost' || host === '127.0.0.1' || host === '::1' ||
        host === '0.0.0.0' || host.endsWith('.localhost') || host.endsWith('.local');
    } catch (_) { return true; }
  }
  /* 载荷只带画像编号、段位、（可选的）本人类型和虚构标记；
     不含分数、逐题答案、边界信息，也不含A的身份与类型。编解码见 dist/share.js。 */

    if (!r) return '';
    return SH.encodeToken({
      id: SH.isArchetypeId(r.archetype_id) ? r.archetype_id : SH.OBSERVATION_ID,
      tier: r.tier || 0,
      demo: demoMode,
      type: shareShowType && !demoMode ? (active()?.meta?.bType || '') : '',

  function shareLink(r) {

  /** 生成用于嵌入卡片的二维码片段，模块边长取整以保证缩放后依旧锐利。 */
  function qrGroupFor(link, centerX, top, target, label) {
    if (!QR || !link) return {markup: '', size: 0};
    const code = QR.encode(link, {ecc: 'M'});
    const total = code.size + 4;                       // 四边各留 2 模块静默区
    const unit = Math.max(2, Math.floor(target / total));
    const size = unit * total;
    return {
      markup: QR.group(link, {x: centerX - size / 2, y: top, size, border: 2,
        dark: '#3a4132', fixed: '#fffdf7', label: label || '扫码打开合拍研究所'}),
      size, unit,
    };
  }

      if (units + weight > maxUnits && line) { lines.push(line); line = ''; units = 0; }
      line += c; units += weight;

    return lines;

  async function copyText(text, okMessage, failMessage) {

      input.value = text; input.style.position = 'fixed'; input.style.opacity = '0';

      let done = false;

  async function downloadShare(button) {
    button.disabled = true;
    const original = button.innerHTML;
    button.textContent = '正在准备图片…';
    try {
      if (document.fonts?.ready) await document.fonts.ready;
      const blob = new Blob([shareSvg()], {type: 'image/svg+xml;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const img = new Image();
      await new Promise((resolve, reject) => {img.onload = resolve; img.onerror = reject; img.src = url;});
      const canvas = document.createElement('canvas');
      canvas.width = 1600; canvas.height = 2120;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      const png = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
      if (!png) throw new Error('Image unavailable');
      const pngUrl = URL.createObjectURL(png);
      const link = document.createElement('a');
      link.href = pngUrl;
      link.download = '合拍研究所_' + portraitInfo(currentResult).name + (demoMode ? '_虚构样例' : '') + '.png';
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(pngUrl), 15000);
      toast('画像已准备好，可以保存到当前设备。');
    } catch (_) { toast('图片暂时无法下载，可以先复制分享短句。'); }
    finally { button.disabled = false; button.innerHTML = original; }
  }

      view = 'shared';
      render();
    } else if (view === 'shared') {
      sharedCard = null;
      home();
    }
  });
  const incomingCard = readSharedFromHash();
  if (incomingCard) {
    sharedCard = incomingCard;
    demoMode = false;
    view = 'shared';
  }
  render();
})();
